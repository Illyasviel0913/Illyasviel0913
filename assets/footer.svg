<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Decorative gradient wave" viewBox="0 0 1280 130" width="1280" height="130" fill="none">
  <title>Decorative gradient wave</title>
  <defs>
    <linearGradient id="waveBack" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.35"/>
      <animate attributeName="x1" values="-0.6;1.6;-0.6" dur="18s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0.4;2.6;0.4" dur="18s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="waveFront" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0.55"/>
      <animate attributeName="x1" values="-0.6;1.6;-0.6" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0.4;2.6;0.4" dur="14s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <path d="M-160 76 C -20 30, 140 108, 330 84 C 520 60, 660 104, 850 78 C 1040 52, 1200 100, 1440 62 L 1440 130 L -160 130 Z" fill="url(#waveBack)">
    <animateTransform attributeName="transform" type="translate" values="0 0; 150 6; 0 0" dur="20s" repeatCount="indefinite"/>
  </path>
  <path d="M-160 96 C -20 56, 150 122, 340 100 C 530 78, 650 118, 850 94 C 1050 70, 1190 116, 1440 84 L 1440 130 L -160 130 Z" fill="url(#waveFront)">
    <animateTransform attributeName="transform" type="translate" values="0 0; -140 -4; 0 0" dur="24s" repeatCount="indefinite"/>
  </path>
</svg>
